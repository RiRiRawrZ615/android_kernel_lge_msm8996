name: Automated Build RiRiRawrZ615 Kernel for LGE MSM8996 with KernelSU-Next (4.4)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'lineage-22.1'
      defconfig:
        description: 'Kernel defconfig to use'
        required: true
        default: 'msm-perf_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        fetch-depth: 0

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev \
          bison flex git gcc-aarch64-linux-gnu python3 python3-pip zip unzip patch
        pip3 install kconfiglib

    - name: Install Android NDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: '9477386'

    - name: Set up toolchain
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk-bundle
        export PATH=$ANDROID_NDK_HOME/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-

    - name: Clean build directory
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- mrproper
        mkdir -p build

    - name: Download KernelSU-Next
      run: |
        git clone --branch next https://github.com/KernelSU-Next/KernelSU-Next.git
        cd KernelSU-Next
        git checkout next
        cd ..

    - name: Apply KernelSU-Next configuration for 4.4
      run: |
        echo "Applying KernelSU-Next configuration for 4.4 pre-GKI"
        scripts/config --enable CONFIG_KSU
        scripts/config --enable CONFIG_KSU_WITH_VFS_HOOKS

    - name: Configure kernel
      run: |
        DEFCONFIG=${{ github.event.inputs.defconfig }}
        if [ -f "arch/arm64/configs/$DEFCONFIG" ]; then
          echo "Using defconfig: $DEFCONFIG"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- O=build $DEFCONFIG
        else
          echo "Error: Defconfig $DEFCONFIG not found in arch/arm64/configs/"
          echo "Available defconfigs:"
          ls -1 arch/arm64/configs/*_defconfig || echo "No defconfigs found"
          AVAILABLE_DEFCONFIG=$(ls arch/arm64/configs/*_defconfig 2>/dev/null | head -n 1)
          if [ -n "$AVAILABLE_DEFCONFIG" ]; then
            DEFCONFIG=$(basename "$AVAILABLE_DEFCONFIG")
            echo "Falling back to default defconfig: $DEFCONFIG"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- O=build $DEFCONFIG
          else
            echo "No valid defconfig found, build cannot proceed"
            exit 1
          fi
        fi
        scripts/config --file build/.config --enable CONFIG_KSU
        scripts/config --file build/.config --enable CONFIG_KSU_WITH_VFS_HOOKS

    - name: Build kernel
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- O=build -j$(nproc --all)

    - name: Package kernel
      run: |
        mkdir -p artifacts
        cp build/arch/arm64/boot/Image.gz-dtb artifacts/ || echo "Warning: Image.gz-dtb not found"
        if [ -f build/arch/arm64/boot/Image.gz-dtb ]; then
          zip -r kernel-artifacts.zip artifacts/
        else
          echo "Kernel image not found, build may have failed."
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: kernel-artifacts.zip
