name: Build Kernel

on:
  workflow_dispatch: # manual run
  push:
    branches:
      - lineage-22.1
  pull_request:
    branches:
      - lineage-22.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        set -x
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          bison \
          build-essential \
          ccache \
          flex \
          gcc-aarch64-linux-gnu \
          libssl-dev \
          make \
          zip \
          android-sdk-ndk-bundle
        echo "Dependencies installed successfully"

    - name: Prepare output dir
      run: |
        set -x
        rm -rf build
        mkdir build
        echo "Output directory prepared"

    - name: Clean kernel source
      run: |
        set -x
        make ARCH=arm64 mrproper && echo "Kernel source cleaned" || { echo "Clean failed"; exit 1; }

    - name: Configure kernel (msm-perf_defconfig)
      run: |
        set -x
        export CROSS_COMPILE=aarch64-linux-android-
        make ARCH=arm64 O=build msm-perf_defconfig V=1 && echo "Kernel configured" || { echo "Configuration failed"; exit 1; }

    - name: Build kernel
      run: |
        set -x
        export CROSS_COMPILE=aarch64-linux-android-
        make ARCH=arm64 O=build -j$(nproc --all) V=1 && echo "Kernel built successfully" || { echo "Build failed"; exit 1; }

    - name: Package Image
      run: |
        set -x
        mkdir -p out
        if [ -f build/arch/arm64/boot/Image.gz-dtb ]; then
          cp build/arch/arm64/boot/Image.gz-dtb out/
          cd out
          zip -r9 kernel.zip . && echo "Kernel packaged successfully" || { echo "Packaging failed"; exit 1; }
        else
          echo "Error: Image.gz-dtb not found, packaging skipped"
          exit 1
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: out/kernel.zip
        if-no-files-found: error
