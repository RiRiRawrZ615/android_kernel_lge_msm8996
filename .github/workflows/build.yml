name: Build Kernel

on:
  workflow_dispatch: # manual run
  push:
    branches:
      - lineage-22.1
  pull_request:
    branches:
      - lineage-22.1

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          bison \
          build-essential \
          ccache \
          flex \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          libssl-dev \
          make \
          zip

    - name: Prepare output dir
      run: |
        rm -rf build
        mkdir build

    - name: Clean kernel source
      run: |
        make ARCH=arm64 mrproper

    - name: Configure kernel (msm-perf_defconfig)
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=build msm-perf_defconfig

    - name: Build kernel
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=build -j$(nproc --all)

    - name: Package Image
      run: |
        mkdir -p out
        cp build/arch/arm64/boot/Image.gz-dtb out/ || true
        cd out
        zip -r9 kernel.zip . || true

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: kernel
        path: out/kernel.zip
