name: Automated Build RiRiRawrZ615 Kernel for LGE MSM8996 with KernelSU-Next and SUSFS (4.4)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'lineage-22.1'
      defconfig:
        description: 'Kernel defconfig to use'
        required: true
        default: 'lineageos_msm8996_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        fetch-depth: 0

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev \
          bison flex git gcc-aarch64-linux-gnu python3 python3-pip zip unzip patch
        pip3 install kconfiglib

    - name: Install Android NDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: '9477386'

    - name: Set up toolchain
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk-bundle
        export PATH=$ANDROID_NDK_HOME/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-

    - name: Clean build directory
      run: |
        make mrproper
        mkdir -p build

    - name: Download KernelSU-Next
      run: |
        git clone --branch next https://github.com/KernelSU-Next/KernelSU-Next.git
        cd KernelSU-Next/kernel
        git checkout next
        cd ../..

    - name: Download SUSFS4KSU
      run: |
        git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu_temp
        cd susfs4ksu_temp
        # Find oldest tag or branch compatible with 4.4
        OLDEST_TAG=$(git tag | sort -V | head -n 1) || git checkout main
        git checkout $OLDEST_TAG 2>/dev/null || git checkout main
        cd ..
        mv susfs4ksu_temp susfs4ksu

    - name: Prepare patch directories
      run: |
        mkdir -p kernel_patches/ksu kernel_patches/susfs
        cp KernelSU-Next/kernel/*.patch kernel_patches/ksu/
        cp susfs4ksu/*.patch kernel_patches/susfs/ 2>/dev/null || echo "No SUSFS patches found, proceeding with manual config"

    - name: Automate KernelSU-Next patching for 4.4
      run: |
        cd kernel_patches/ksu
        for patch in *.patch; do
          if ! grep -q "5\." "$patch"; then
            git -C ../.. apply "$patch" || {
              echo "Attempting backport for $patch"
              git -C ../.. apply --3way "$patch" || {
                echo "Backport failed for $patch, skipping"
                continue
              }
            }
          else
            echo "Skipping $patch (5.x+ incompatible)"
          fi
        done
        cd ../..

    - name: Automate SUSFS4KSU patching for 4.4
      run: |
        if [ -d "kernel_patches/susfs" ]; then
          cd kernel_patches/susfs
          for patch in *.patch; do
            git -C ../.. apply --3way "$patch" || {
              echo "Warning: $patch failed, attempting partial apply with rejects"
              git -C ../.. apply --reject "$patch" && echo "Applied with rejects, manual review needed" || echo "Patch $patch failed, skipping"
            }
          done
          cd ../..
        else
          echo "Warning: No SUSFS4KSU patches available, SUSFS support disabled"
        fi

    - name: Configure kernel
      run: |
        DEFCONFIG=${{ github.event.inputs.defconfig }}
        if [ -f "arch/arm64/configs/$DEFCONFIG" ]; then
          make O=build $DEFCONFIG
          # Enable KernelSU-Next with VFS hooks for 4.4
          scripts/config --file build/.config --enable CONFIG_KSU
          scripts/config --file build/.config --enable CONFIG_KSU_WITH_VFS_HOOKS
          # Attempt SUSFS, warn if unsupported
          scripts/config --file build/.config --enable CONFIG_SUSFS || echo "Warning: CONFIG_SUSFS not supported, ensure patches applied"
        else
          echo "Error: Defconfig $DEFCONFIG not found in arch/arm64/configs/"
          exit 1
        fi

    - name: Build kernel
      run: |
        make O=build -j$(nproc --all)

    - name: Package kernel
      run: |
        mkdir -p artifacts
        cp build/arch/arm64/boot/Image.gz-dtb artifacts/ || echo "Warning: Image.gz-dtb not found"
        if [ -f build/arch/arm64/boot/Image.gz-dtb ]; then
          zip -r kernel-artifacts.zip artifacts/
        else
          echo "Kernel image not found, build may have failed."
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: kernel-artifacts.zip
