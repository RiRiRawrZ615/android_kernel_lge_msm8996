name: Automated Build RiRiRawrZ615 Kernel for LGE MSM8996 with KernelSU-Next (4.4)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'lineage-22.1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        fetch-depth: 0

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev \
          bison flex git gcc-aarch64-linux-gnu python3 python3-pip zip unzip patch
        pip3 install kconfiglib

    - name: Clean kernel source
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE mrproper
        mkdir -p build

    - name: Download KernelSU-Next
      run: |
        git clone --branch next https://github.com/KernelSU-Next/KernelSU-Next.git
        cd KernelSU-Next
        git checkout next
        cd ..

    - name: Apply KernelSU-Next configuration for 4.4
      run: |
        echo "Applying KernelSU-Next configuration for 4.4 pre-GKI"
        scripts/config --enable CONFIG_KSU
        scripts/config --enable CONFIG_KSU_WITH_VFS_HOOKS

    - name: Configure kernel
      run: |
        DEFCONFIG=msm-perf_defconfig
        if [ -f "arch/arm64/configs/$DEFCONFIG" ]; then
          echo "Using defconfig: $DEFCONFIG"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=build $DEFCONFIG
        else
          echo "Error: $DEFCONFIG not found!"
          exit 1
        fi
        scripts/config --file build/.config --enable CONFIG_KSU
        scripts/config --file build/.config --enable CONFIG_KSU_WITH_VFS_HOOKS

    - name: Build kernel
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=build -j$(nproc --all)

    - name: Package kernel
      run: |
        mkdir -p artifacts
        cp build/arch/arm64/boot/Image.gz-dtb artifacts/ || echo "Warning: Image.gz-dtb not found"
        if [ -f build/arch/arm64/boot/Image.gz-dtb ]; then
          zip -r kernel-artifacts.zip artifacts/
        else
          echo "Kernel image not found, build may have failed."
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: kernel-artifacts.zip
